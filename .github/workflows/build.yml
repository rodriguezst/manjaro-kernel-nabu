name: buildarmpkg
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      -
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'

      - name: setup deb822 repos
        run: |
          cat <<EOF > deb822sources
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble
          Components: main restricted universe
          Architectures: amd64
          
          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe
          Architectures: amd64
          
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble-updates
          Components: main restricted universe
          Architectures: amd64
          
          Types: deb
          URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
          Suites: noble
          Components: main restricted multiverse universe
          Architectures: arm64
          
          Types: deb
          URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
          Suites: noble-updates
          Components: main restricted multiverse universe
          Architectures: arm64
          EOF
  
          sudo mv deb822sources /etc/apt/sources.list.d/ubuntu.sources
      - 
        name: Install dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt install \
            build-essential \
            gcc-aarch64-linux-gnu \
            libarchive-dev \
            libarchive-tools \
            meson \
            sbsigntool \
            systemd-ukify \
            systemd-boot-efi:arm64
          # dirty hack to make systemd-ukify use aarch64 EFI stub
          sudo cp /usr/lib/systemd/boot/efi/linuxaa64.efi.stub \
            /usr/lib/systemd/boot/efi/linuxx64.efi.stub
      - 
        name: Install pacman
        shell: bash
        env:
          PACMAN_VERSION: 6.0.2
        run: |
          sudo git clone --depth 1 https://gitlab.manjaro.org/packages/core/pacman.git
          pushd pacman
            sudo wget https://sources.archlinux.org/other/pacman/pacman-${PACMAN_VERSION}.tar.xz
            sudo tar -xvf pacman-${PACMAN_VERSION}.tar.xz
            pushd pacman-${PACMAN_VERSION}
            #  sudo patch -p1 -i ../pacman-sync-first-option.patch Removed
              sudo meson --prefix=/usr \
                        --buildtype=plain \
                        -Ddoc=disabled \
                        -Ddoxygen=enabled \
                        -Dscriptlet-shell=/usr/bin/bash \
                        -Dldconfig=/usr/bin/ldconfig \
                        build
              sudo meson compile -C build
              sudo meson install -C build
            popd
            sudo install -m644 pacman.conf /etc/pacman.conf
            sudo install -m644 makepkg.conf /etc/
            sudo mkdir -p /etc/pacman.d
            sudo touch /etc/pacman.d/mirrorlist
          popd
      -
        name: Setup SSL Files
        shell: bash
        run: |
          # Decode and store key
          echo "${{ secrets.SECURE_BOOT_KEY }}" | base64 -d > sb.key
          # Decode and store certificate
          echo "${{ secrets.SECURE_BOOT_CERTIFICATE }}" | base64 -d > sb.crt
          # Set correct permissions
          chmod 600 sb.key
          chmod 644 sb.crt
      -
        name: Run makepkg
        shell: bash
        run: |
          cat << EOM | sudo tee -a /etc/makepkg.conf
          CARCH="aarch64"
          CHOST="aarch64-linux-gnu"
          export ARCH='arm64'
          export CROSS_COMPILE='aarch64-linux-gnu-'
          EOM
          makepkg -d
          source PKGBUILD
          echo "PACKAGE_NAME=$pkgbase-$pkgver-$pkgrel" >> $GITHUB_ENV
      - 
        name: Copy Package Files
        run: |
          mkdir -p ./artifacts
          find . -type f -name '*.pkg.tar.*' -exec cp '{}' ./artifacts/ ';'
      -
        name: Release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PACKAGE_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PACKAGE_NAME }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.pkg.tar.*
